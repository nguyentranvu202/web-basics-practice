<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính điểm sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>TÍNH ĐIỂM SINH VIÊN</h1>

        <label>Họ và tên sinh viên:</label>
        <input type="text" id="studentName" placeholder="Nhập họ và tên">

        <h3>Nhập điểm 5 môn học</h3>

        <label>Giải tích 1:</label>
        <input type="number" id="score1" min="0" max="10">

        <label>Đại số tuyến tính:</label>
        <input type="number" id="score2" min="0" max="10">

        <label>Xác suất thống kê:</label>
        <input type="number" id="score3" min="0" max="10">

        <label>Tin học đại cương:</label>
        <input type="number" id="score4" min="0" max="10">

        <label>Xây dựng ứng dụng Web:</label>
        <input type="number" id="score5" min="0" max="10">

        <button onclick="calculateResult()">Tính kết quả</button>

        <p id="error"></p>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
